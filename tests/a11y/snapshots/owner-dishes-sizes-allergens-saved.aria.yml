        - link "Choice lists None"
  - paragraph: Changes on this page save when you press Save allergens.
  - paragraph: Tick each major allergen this dish contains, add any others below, then check the list once it is complete.
  - group "Major allergens":
    - text: Major allergens
    - checkbox "Milk" [checked]
    - text: Milk Butter, ghee, cheese, cream, yogurt, and whey count too.
    - checkbox "Eggs"
    - text: Eggs Mayonnaise, aioli, meringue, and egg wash count too.
    - checkbox "Fish"
    - text: Fish Anchovies, fish sauce, and Worcestershire sauce count too.
    - checkbox "Shellfish"
    - text: Shellfish Shrimp, crab, and lobster, and also clams, mussels, oysters, and scallops.
    - checkbox "Tree nuts"
    - text: Tree nuts Almonds, walnuts, pecans, cashews, pistachios, and pesto count too.
    - checkbox "Peanuts"
    - text: Peanuts Peanut oil, peanut butter, and satay sauce count too.
    - checkbox "Wheat" [checked]
    - text: Wheat Flour, bread crumbs, pasta, soy sauce, and beer batter count too.
    - checkbox "Soy"
    - text: Soy Soy sauce, tofu, edamame, miso, and tempeh count too.
    - checkbox "Sesame"
    - text: Sesame Tahini, hummus, sesame oil, and seeds on buns count too.
  - list "Other allergens":
    - listitem:
      - text: Other allergen 1
      - combobox "Other allergen 1": celery
      - button "Show allergen names, celery"
      - text: Like celery, mustard, or sulfites. One allergen per row.
      - button "Remove allergen, celery": Remove allergen
  - button "Add another allergen"
  - checkbox "The allergen list is complete" [checked]
  - text: The allergen list is complete Check this once every allergen in this dish is listed above. A change to the list clears the check.
  - paragraph: "/Diners read: Contains milk, wheat, celery\\. Checked by you on \\w+ \\d+, \\d+\\./"
  - list:
    - listitem:
      - paragraph: Soup of the day is also in Mains, Dinner, not checked yet.
      - button "Apply this list there, Soup of the day in Mains, Dinner": Apply this list there
