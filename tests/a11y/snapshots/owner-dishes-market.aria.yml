      - listitem:
        - link "Dinner"
      - listitem:
        - link "Starters"
      - listitem: Garlic bread
  - heading "Garlic bread" [level=1]
  - paragraph: Each change saves when you leave its field.
  - text: Description
  - textbox "Description"
  - text: What is in it and how it is made. Diners read it in full.
  - heading "Price" [level=2]
  - radiogroup "Price":
    - text: Diners read "Market price."
    - radio "One price"
    - text: One price
    - radio "Prices by size"
    - text: Prices by size
    - radio "Market price" [checked]
    - text: Market price
  - text: Calories
  - textbox "Calories": /\d+/
  - text: /A number, like \d+, or a range, like \d+ to \d+\. Note/
  - textbox "Note"
  - text: A short line diners read with this dish, like "Comes with fries or a salad."
  - heading "Allergens" [level=2]
  - paragraph: Tick each major allergen this dish contains, add any others below, then check the list once it is complete.
  - group "Major allergens":
    - text: Major allergens
    - checkbox "Milk"
    - text: Milk Butter, ghee, cheese, cream, yogurt, and whey count too.
    - checkbox "Eggs"
    - text: Eggs Mayonnaise, aioli, meringue, and egg wash count too.
    - checkbox "Fish"
    - text: Fish Anchovies, fish sauce, and Worcestershire sauce count too.
    - checkbox "Shellfish"
    - text: Shellfish Shrimp, crab, and lobster, and also clams, mussels, oysters, and scallops.
    - checkbox "Tree nuts"
    - text: Tree nuts Almonds, walnuts, pecans, cashews, pistachios, and pesto count too.
    - checkbox "Peanuts"
    - text: Peanuts Peanut oil, peanut butter, and satay sauce count too.
    - checkbox "Wheat"
    - text: Wheat Flour, bread crumbs, pasta, soy sauce, and beer batter count too.
    - checkbox "Soy"
    - text: Soy Soy sauce, tofu, edamame, miso, and tempeh count too.
    - checkbox "Sesame"
    - text: Sesame Tahini, hummus, sesame oil, and seeds on buns count too.
  - button "Add another allergen"
  - checkbox "The allergen list is complete"
  - text: The allergen list is complete Check this once every allergen in this dish is listed above. A change to the list clears the check.
  - paragraph: "Diners read: Allergens not confirmed yet. Ask your server. Not checked yet."
  - heading "Dietary tags" [level=2]
  - group "Dietary tags":
    - checkbox "Vegan"
    - text: Vegan No meat, fish, dairy, eggs, or honey.
    - checkbox "Vegetarian"
    - text: Vegetarian No meat or fish. Tick Vegan instead for a vegan dish.
    - checkbox "Made without gluten ingredients"
    - text: Made without gluten ingredients Ingredients only. A dedicated fryer or a shared kitchen is said in your restaurant's allergen note.
  - heading "Availability" [level=2]
  - radiogroup "Availability":
    - text: Hidden from diners until you choose Available.
    - radio "Available"
    - text: Available
    - radio "Sold out today"
    - text: Sold out today Diners read Sold out today. It comes back on its own at the end of your day.
    - radio "Off the menu for now" [checked]
    - text: Off the menu for now Diners do not see this dish until you choose Available again.
  - heading "Schedule" [level=2]
  - paragraph: Set a schedule to make this dish a special. Diners see it only on the days you choose, from the start of the day until its hours end. Leave everything blank for a dish that is always on the menu.
  - group "Days":
    - text: Days
    - checkbox "Monday"
    - text: Monday
    - checkbox "Tuesday"
    - text: Tuesday
    - checkbox "Wednesday"
    - text: Wednesday
    - checkbox "Thursday"
    - text: Thursday
    - checkbox "Friday"
    - text: Friday
    - checkbox "Saturday"
    - text: Saturday
    - checkbox "Sunday"
    - text: Sunday
  - group "Hours":
    - text: Hours
    - paragraph: /For example, \d+ am, 5:\d+ pm, or \d+:\d+\. Leave both blank for all day\./
    - text: Starts
    - textbox "Starts"
    - text: Ends
    - textbox "Ends"
  - button "Today only"
  - text: First day
  - textbox "First day"
  - text: /For example, October \d+ or \d+\/\d+\/\d+\. Last day/
  - textbox "Last day"
  - text: /For example, October \d+ or \d+\/\d+\/\d+\./
  - paragraph: Which of the month's Fridays, for a special on the first Friday of each month. Needs a day above.
  - group "Weeks of the month":
    - text: Weeks of the month
    - checkbox "First"
    - text: First
    - checkbox "Second"
    - text: Second
    - checkbox "Third"
    - text: Third
    - checkbox "Fourth"
    - text: Fourth
    - checkbox "Last"
    - text: Last
  - paragraph: For a special that comes back each year, like a soup from September to April.
  - group "Months of the year":
    - text: Months of the year
    - checkbox "January"
    - text: January
    - checkbox "February"
    - text: February
    - checkbox "March"
    - text: March
