    - text: November
    - checkbox "December"
    - text: December
  - paragraph: No schedule. Diners see this dish whenever it is available.
  - heading "Cooked to order" [level=2]
  - checkbox "Cooked to order" [checked]
  - text: Cooked to order For meat, fish, or eggs that can be served rare or undercooked. Diners read Cooked to order. with this dish, and the menu carries the advisory once.
  - heading "Choice lists" [level=2]
  - paragraph: What a diner picks or adds with this dish, like a side, a dressing, or an add-on. Each list has a lead, like Choose one side, and its options.
