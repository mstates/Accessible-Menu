- main:
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Menus"
      - listitem:
        - link "Dinner"
      - listitem:
        - link "Starters"
      - listitem: Add a buttered roll to any dish
  - heading "Add a buttered roll to any dish" [level=1]
  - paragraph: Each change saves when you leave its field.
  - text: Lead
  - combobox "Lead": Add a buttered roll to any dish
  - button "Show suggested leads"
  - text: The words diners read first, like Choose one side or Add on.
  - status: All changes saved
  - paragraph: Options are what a diner picks or adds, like Fries or Ranch. Each has its own allergen list.
  - list:
    - listitem:
      - heading "Buttered roll" [level=2]
      - text: Option name for Buttered roll
      - textbox "Option name for Buttered roll": Buttered roll
      - text: Added price for Buttered roll
      - textbox "Added price for Buttered roll": /\d+\.\d+/
      - text: /In dollars, like 1 or \d+\.\d+\. Leave blank when it costs nothing extra\. Calories for Buttered roll/
      - textbox "Calories for Buttered roll"
      - text: /A number, like \d+, or a range, like \d+ to \d+\./
      - button "Move up, Buttered roll" [disabled]: Move up
      - button "Move down, Buttered roll" [disabled]: Move down
      - button "Remove, Buttered roll": Remove
      - heading "Allergens for Buttered roll" [level=3]
      - paragraph: Tick each major allergen this option contains, add any others below, then check the list once it is complete.
      - group "Major allergens":
        - text: Major allergens
        - checkbox "Milk" [checked]
        - text: Milk Butter, ghee, cheese, cream, yogurt, and whey count too.
        - checkbox "Eggs"
        - text: Eggs Mayonnaise, aioli, meringue, and egg wash count too.
        - checkbox "Fish"
        - text: Fish Anchovies, fish sauce, and Worcestershire sauce count too.
        - checkbox "Shellfish"
        - text: Shellfish Shrimp, crab, and lobster, and also clams, mussels, oysters, and scallops.
        - checkbox "Tree nuts"
        - text: Tree nuts Almonds, walnuts, pecans, cashews, pistachios, and pesto count too.
        - checkbox "Peanuts"
        - text: Peanuts Peanut oil, peanut butter, and satay sauce count too.
        - checkbox "Wheat" [checked]
        - text: Wheat Flour, bread crumbs, pasta, soy sauce, and beer batter count too.
        - checkbox "Soy"
        - text: Soy Soy sauce, tofu, edamame, miso, and tempeh count too.
        - checkbox "Sesame"
        - text: Sesame Tahini, hummus, sesame oil, and seeds on buns count too.
      - button "Add another allergen"
      - checkbox "The allergen list is complete" [checked]
      - text: The allergen list is complete Check this once every allergen in this option is listed above. A change to the option's name or its list clears the check.
      - paragraph: "/Diners read: Contains milk, wheat\\. Checked by you on \\w+ \\d+, \\d+\\./"
  - text: New option name
  - textbox "New option name"
  - button "Add option"
  - log
