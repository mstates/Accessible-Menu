name: Accessibility gate

# Vercel posts one GitHub deployment status per deployment, "success", with
# the deployment URL. GitHub runs this workflow on the deployed commit, so
# the result shows on that commit and on any pull request that carries it.
# No concurrency group: a Production deployment of the same commit would
# share a group keyed on the SHA and cancel the preview's gate mid-run.
# No caches: a deployment_status run is not tied to a branch or tag ref, so
# actions/cache and setup-node's npm cache refuse it (D-102). Dependencies
# install fresh. The browser jobs run in Playwright's own image, which holds
# the browsers and every system package they need, so no job runs apt
# (D-146): on October 7 Azure's Ubuntu mirror held the install past the cap.
# The image is pinned by digest and moved by hand, since Dependabot does not
# read it. The install step stays: it does nothing while the image matches
# @playwright/test, and fetches only the browsers when it does not.
# Each job runs one slice of the Playwright projects (D-137): the public
# pages once per engine, and the owner screens in two jobs, so the gate's
# wall clock is its slowest job, not the sum of them.
# No job name holds a matrix value. A skipped job is never expanded, so
# GitHub would show the expression as written. With none, a skipped job
# shows its plain name, and GitHub adds the matrix value in parentheses to
# a job that runs.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  # One job per engine, each with its five sizes; Chromium's also runs the
  # two forced-colors projects. A failure in one engine never cancels the
  # others.
  a11y-public:
    name: Public pages on the preview
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-26.04
    # The runner's own user, so the workspace and HOME belong to the user
    # the browsers run as.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install ${{ matrix.engine }}
      - run: npm run a11y -- "--project=${{ matrix.engine }}-*"
        env:
          A11Y_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # The diner pages the gate reads are CI Diner's, published by its
          # data file; the code is a variable, not a secret.
          A11Y_MENU_CODE: ${{ vars.A11Y_OWNER_CODE }}
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-traces-${{ matrix.engine }}-${{ github.event.deployment.sha }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  # Vercel's deployment carries the commit, not the branch (ref equals the
  # sha, payload empty), so the branch is decided here: the commit must
  # already be on main. This job checks out nothing and holds no secret. A
  # failed API call fails it, and the owner job below is then skipped.
  on-main:
    name: Is the deployed commit on main?
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      on_main: ${{ steps.branch.outputs.on_main }}
    steps:
      - id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
          echo "compare main...${SHA}: ${status}"
          if [ "${status}" = "identical" ] || [ "${status}" = "behind" ]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a main commit. Owner checks run on main previews only."
          fi

  # Skipped, not green, for any other branch's preview. A step added later
  # cannot run without the guard. Two jobs from one definition: Chromium in
  # full with its arrival and forced-colors projects, and WebKit with
  # Firefox's one desktop project beside it. Each signs in and out on its
  # own, and the password still reaches one step of one job definition. The
  # matrix holds only the browsers, the one value GitHub adds to the name.
  a11y-owner:
    name: Owner screens on main previews, signed in
    needs: on-main
    if: needs.on-main.outputs.on_main == 'true'
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browsers: [chromium, webkit firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install ${{ matrix.browsers }}
      # The only step that reads the secret. Missing variables fail the
      # Playwright config with a message that points to the Build plan;
      # nothing skips. No artifact step: the session never leaves the runner.
      # Each browser adds its owner projects. The project names carry a star
      # for Playwright, so the shell's own globbing is off.
      - name: Owner checks, signed in as the test owner
        run: |
          set -f
          projects=""
          for browser in ${{ matrix.browsers }}; do
            projects="${projects} --project=owner-${browser}-*"
          done
          npm run a11y -- ${projects}
        env:
          A11Y_SCOPE: owner
          A11Y_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          A11Y_OWNER_EMAIL: ${{ vars.A11Y_OWNER_EMAIL }}
          A11Y_OWNER_PASSWORD: ${{ secrets.A11Y_OWNER_PASSWORD }}
          A11Y_OWNER_CODE: ${{ vars.A11Y_OWNER_CODE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
