name: Accessibility gate

# Vercel posts one GitHub deployment status per deployment, "success", with
# the deployment URL. GitHub runs this workflow on the deployed commit, so
# the result shows on that commit and on any pull request that carries it.
# No concurrency group: a Production deployment of the same commit would
# share a group keyed on the SHA and cancel the preview's gate mid-run.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  a11y-public:
    name: Public pages on the preview
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium build
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run a11y
        env:
          A11Y_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-traces-${{ github.event.deployment.sha }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
