# Dependabot (D-138). Security updates are on in the repository settings
# and work as before; nothing in this file changes them. Version updates
# come once a month as pull requests into main, the default branch, where
# Checks and the public gate run on them. The owner gate runs once one
# merges (D-101, D-137).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # A bump of @playwright/test (playwright-core moves with it) is read by
    # running the two aria snapshot update commands first and reading the
    # files' diff (the commands are in tests/a11y/aria-snapshot.ts):
    # tests/a11y/snapshot-files.mjs imports Playwright's renderer from
    # playwright-core/lib/coreBundle, not a public API, so a release that
    # moves it fails at that import, and one that changes what the renderer
    # writes shows as a diff of every file (D-194).
    schedule:
      interval: monthly
    # An update joins the first group it matches, so the order matters.
    groups:
      # Majors that must move together come as one pull request per set.
      # Their minors and patches still fall to minor-and-patch.
      next-major:
        patterns: ["next", "eslint-config-next"]
        update-types: ["major"]
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
      # Minor and patch updates come together in one pull request. Any other
      # major is outside every group, so it comes alone, to be read on its
      # own.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Supabase CLI is parked until a sitting of its own. With no
      # versions listed, this holds back version updates only; a security
      # update for it still comes. Delete this entry in that sitting.
      - dependency-name: "supabase"
      # Node, .nvmrc, engines, and @types/node move together, by hand, as
      # one task (D-138). Its minors and patches still come in the group.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Two majors our lint tools cannot take yet. Ranges, not update types,
      # so a major below the hold, like TypeScript 6, still comes, and so do
      # the minors and patches under it. A held version opens no pull
      # request, so the holds are checked by hand with each month's run
      # (D-138). Delete an entry once every line for it takes the held major:
      #   npm view eslint-plugin-jsx-a11y peerDependencies.eslint
      #   npm view eslint-plugin-react peerDependencies.eslint
      #   npm view eslint-plugin-import peerDependencies.eslint
      #   npm view typescript-eslint peerDependencies.typescript
      # eslint 10 and above wait for jsx-a11y, react, and import, which
      # eslint-config-next brings. At 6.10.2, 7.37.5, and 2.32.0 each stops at
      # eslint 9, so npm ci refuses eslint 10 (#3).
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # TypeScript 7 and above wait for typescript-eslint. At 8.71 it takes
      # TypeScript below 6.1, so lint fails on 7 (#4, D-46).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    # Nothing younger than a week, so a bad or hijacked release has time to
    # be pulled. Security updates are never delayed.
    cooldown:
      default-days: 7
    # The grouped pull request and two more at most. The rest wait for next
    # month's run.
    open-pull-requests-limit: 3

  # Every action in one pull request. The workflows pin each action by its
  # full commit SHA with the version beside it (D-138), and this keeps both
  # current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
